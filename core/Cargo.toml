[package]
name = "cleanpassword-core"
description = "CleanPassword's shared core: the encrypted vault, S3 sync, password generator, website matching, TOTP and imports."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std", "wasmbind"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Encryption: Argon2id for the master password, XChaCha20-Poly1305 for
# everything stored, zeroize for keys in memory.
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
getrandom = "0.2"
base64 = "0.22"
# S3 request signing (SigV4) and TOTP.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Bitwarden's password-protected exports (PBKDF2 or Argon2id, then
# AES-256-CBC with HMAC-SHA256).
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# Website matching: URLs, and registrable domains from the Public Suffix List.
url = "2"
psl = "2"
regex-lite = "0.1"
# CSV imports.
csv = "1"
# Passkeys: P-256 keys (ES256 signatures, PKCS#8 storage as Bitwarden keeps them).
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
pollster = "0.4"
