<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanPassword — Passkey</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  #root { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px; }
  .head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .head .mono { width: 52px; height: 52px; font-size: 24px; border-radius: 12px; }
  .head h1 { font-size: 17px; margin: 0; }
  .list { background: var(--bg2); border-radius: var(--radius); padding: 4px; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .actions .btn { width: 100%; padding: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg2); }
  input, select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); font-size: 13px; }
</style>
</head>
<body>
<main id="root"></main>
<script src="passkey.js"></script>
</body>
</html>
