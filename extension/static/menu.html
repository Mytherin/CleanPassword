<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanPassword</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { background: var(--bg); overflow: hidden; }
  #root { padding: 4px; display: flex; flex-direction: column; }
  #root > * { flex: none; }
  #root > .list { flex: 0 1 auto; min-height: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .list { max-height: 272px; overflow-y: auto; overscroll-behavior: contain; }
  .filter { display: block; width: calc(100% - 8px); margin: 4px 4px 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); outline: none; }
  .filter:focus { border-color: var(--accent); }
  .confirm .sub { color: var(--warn-fg); }
  .suggest-wrap { display: flex; align-items: center; gap: 4px; }
  .suggest-wrap .row { flex: 1; min-width: 0; }
  .suggest-wrap .copy { flex: none; margin-right: 6px; }
</style>
</head>
<body>
<div id="root" role="listbox" aria-label="CleanPassword"></div>
<script src="menu.js"></script>
</body>
</html>
