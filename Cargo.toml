[workspace]
# core: the vault, its encryption, S3 sync, the generator, matching, TOTP and
#       imports, shared by every app.
# wasm: the core for the Chrome extension (WebAssembly, wasm-bindgen).
# ffi:  the core for the iPhone app and its AutoFill extension (UniFFI).
members = ["core", "wasm", "ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Argon2 is unbearably slow unoptimised, also in tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
