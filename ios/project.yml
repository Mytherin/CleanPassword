# The iPhone app's Xcode project, for XcodeGen (`brew install xcodegen`):
#
#   ios/build-rust.sh && cd ios && xcodegen && open CleanPassword.xcodeproj
#
# The Rust core is built by ios/build-rust.sh, which the project also runs
# before compiling.
name: CleanPassword
options:
  bundleIdPrefix: com.cleanpassword
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CleanPassword:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - CleanPasswordTests
    sources:
      - path: CleanPassword
        excludes: [Info.plist]
      - path: Shared
      - path: Generated/cleanpassword_ffi.swift
        optional: true
        createIntermediateGroups: true
    entitlements:
      path: CleanPassword/CleanPassword.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleanpassword.app
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # The Mac (Mac Catalyst), where apps and extensions run sandboxed;
        # iOS ignores these.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # A screenshot of a QR code, chosen to set up a verification code.
        com.apple.security.files.user-selected.read-only: true
    # So automatic signing enables App Groups and AutoFill on the App ID.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.AutoFillCredentialProvider:
          enabled: 1
    dependencies:
      - target: CleanPasswordAutoFill
        embed: true
        codeSign: true
      # Safari on the Mac takes the Chrome extension's place there; this
      # one is for the iPhone.
      - target: CleanPasswordSafari
        embed: true
        codeSign: true
        platformFilter: iOS
      - framework: build/CleanPasswordCore.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework
      - target: RustCore
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanpassword.app
        PRODUCT_NAME: CleanPassword
        # Also a Mac app (Mac Catalyst), with the same ids as on the iPhone.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: YES
        # What the generated keys go into: the otpauth:// URL scheme (a
        # verification-code QR code scanned with the Camera app opens the
        # app to set it up on a login).
        INFOPLIST_FILE: CleanPassword/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CleanPassword
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks your passwords.
        INFOPLIST_KEY_NSCameraUsageDescription: The camera scans the QR codes sites show to set up verification codes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  # The AutoFill credential provider: "CleanPassword" in Settings → General →
  # AutoFill & Passwords, then above the keyboard, in Safari's sign-in, in
  # verification-code fields, and in any field's AutoFill → Passwords menu.
  CleanPasswordAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: CleanPasswordAutoFill
      - path: Shared
      - path: Generated/cleanpassword_ffi.swift
        optional: true
        createIntermediateGroups: true
    info:
      path: CleanPasswordAutoFill/Info.plist
      properties:
        CFBundleDisplayName: CleanPassword
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Face ID unlocks your passwords.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              # iOS 18: verification codes, and any field's AutoFill → Passwords menu.
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: true
    entitlements:
      path: CleanPasswordAutoFill/CleanPasswordAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleanpassword.app
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # The Mac (Mac Catalyst), where apps and extensions run sandboxed;
        # iOS ignores these.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    # So automatic signing enables App Groups and AutoFill on the App ID.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.AutoFillCredentialProvider:
          enabled: 1
    dependencies:
      - target: RustCore
        embed: false
        link: false
      - framework: build/CleanPasswordCore.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanpassword.app.AutoFill
        PRODUCT_NAME: CleanPasswordAutoFill
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Safari extension: CleanPassword's browser extension in Safari, built
  # by extension/build.mjs into extension/dist-safari first:
  #   cd extension && npm ci && npm run build
  CleanPasswordSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: CleanPasswordSafari
    info:
      path: CleanPasswordSafari/Info.plist
      properties:
        CFBundleDisplayName: CleanPassword
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    dependencies:
      - sdk: SafariServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanpassword.app.Safari
        PRODUCT_NAME: CleanPasswordSafari
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    # The web extension's files go at the root of the bundle's resources,
    # where Safari looks for manifest.json.
    postBuildScripts:
      - name: Copy the web extension
        basedOnDependencyAnalysis: false
        script: |
          SRC="$PROJECT_DIR/../extension/dist-safari"
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "error: build the browser extension first: cd extension && npm ci && npm run build"
            exit 1
          fi
          cp -R "$SRC/." "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
  # Tests of the bindings and the app's model, in the iOS Simulator:
  #   xcodebuild test -project CleanPassword.xcodeproj -scheme CleanPassword \
  #     -destination 'platform=iOS Simulator,name=iPhone 16'
  CleanPasswordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CleanPasswordTests
    dependencies:
      - target: CleanPassword
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanpassword.tests
        GENERATE_INFOPLIST_FILE: YES

# The Rust core and its Swift bindings (ios/build-rust.sh), built first: the
# app and its AutoFill extension both compile the generated Swift, so the
# script runs in a target of its own that both depend on.
aggregateTargets:
  RustCore:
    buildScripts:
      - name: Build the Rust core
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            "$PROJECT_DIR/build-rust.sh" --debug
          else
            "$PROJECT_DIR/build-rust.sh"
          fi
        outputFiles:
          - $(PROJECT_DIR)/Generated/cleanpassword_ffi.swift
