[package]
name = "cleanpassword-wasm"
description = "CleanPassword's core for the Chrome extension (WebAssembly)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cleanpassword-core = { path = "../core" }
# Pinned: must match the wasm-bindgen CLI that builds the extension
# (extension/build.mjs).
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
