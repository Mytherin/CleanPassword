name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust core and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (same version as the crate)
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run build && npm run typecheck
        working-directory: extension
      - name: Tests in Chrome
        run: ../.github/annotate.sh node test/run.mjs
        working-directory: extension
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: CleanPassword-chrome-extension
          path: extension/dist

  ios:
    name: iPhone app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: .github/annotate.sh ios/build-rust.sh --debug
      - run: xcodegen
        working-directory: ios
      - name: Build and test in the Simulator
        working-directory: ios
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9][0-9]*[^(]*' | sed 's/ *$//')"
          echo "Destination: $DEST"
          ../.github/annotate.sh xcodebuild test -quiet -project CleanPassword.xcodeproj -scheme CleanPassword -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO
